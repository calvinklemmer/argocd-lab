apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-selective-sync
  namespace: argocd
spec:
  destination:
    namespace: guestbook-selective-sync
    server: "https://kubernetes.default.svc"
  project: default
  source:
    path: apps/guestbook-selective-sync
    repoURL: "https://github.com/calvinklemmer/argocd-lab.git"
    targetRevision: master
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
