apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-remote-cluster
  namespace: argocd
spec:
  destination:
    namespace: guestbook
    server: "https://192.168.67.2:8443"
  project: default
  source:
    path: guestbook
    repoURL: "https://github.com/mabusaa/argocd-example-apps.git"
    targetRevision: master
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
